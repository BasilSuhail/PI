<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="theme-color" content="#d9e4e8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#373e45" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light" />
    <title>Tailnet Console</title>
  </head>
  <body>
    <script>
      try {
        var t = localStorage.getItem("appearance");
        if (t) document.documentElement.dataset.theme = t;
      } catch (e) { /* private mode */ }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
