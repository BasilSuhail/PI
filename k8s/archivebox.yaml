# ArchiveBox: a self-hosted internet archive. Feed it URLs and it saves
# everything — HTML snapshots, PDFs, screenshots, media, git repos — using
# wget, yt-dlp, and its own headless browser under the hood.
#
# Deployed by deploy/install-archivebox.sh.
#
# The same SSD/6TB split as Jellyfin and Kiwix:
#
#   the app     __APPS_DIR__/ArchiveBox   the SQLite index and config. Small,
#                                         read at random, and the part where
#                                         speed is felt.
#   the data    __DATA_DIR__/ArchiveBox   the archived content. Pages, videos,
#                                         PDFs — the reason this exists. Large,
#                                         read sequentially, and what the 6TB
#                                         is for.
#
# ArchiveBox keeps its index (a SQLite database) alongside the archived files
# by default. The DATA_DIR env var points it at the 6TB; the index is
# symlinked from there back to the SSD by the installer, so the database gets
# fast random reads and the bulk content gets capacity.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: archivebox
  namespace: pi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: archivebox
  template:
    metadata:
      labels:
        app: archivebox
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      securityContext:
        runAsUser: __UID__
        runAsGroup: __GID__
        fsGroup: __GID__
      containers:
        - name: archivebox
          image: archivebox/archivebox:0.7.4
          ports:
            - name: http
              containerPort: 8000
          command: ["/bin/bash", "-c"]
          args:
            - |
              if [ -f /index/index.sqlite3 ] && [ ! -e /data/index.sqlite3 ]; then
                ln -s /index/index.sqlite3 /data/index.sqlite3
              fi
              archivebox init --setup 2>/dev/null || true
              if [ -f /data/index.sqlite3 ] && [ ! -L /data/index.sqlite3 ]; then
                mv /data/index.sqlite3 /index/index.sqlite3
                ln -s /index/index.sqlite3 /data/index.sqlite3
              fi
              exec archivebox server 0.0.0.0:8000
          env:
            - name: ALLOWED_HOSTS
              value: "*"
            - name: PUBLIC_INDEX
              value: "True"
            - name: PUBLIC_SNAPSHOTS
              value: "True"
            - name: PUBLIC_ADD_VIEW
              value: "False"
            # The admin account, created on first init. Written by the
            # installer into a ConfigMap rather than pinned here, so a
            # re-apply cannot silently reset a password changed since.
            - name: ADMIN_USERNAME
              valueFrom:
                configMapKeyRef:
                  name: archivebox-config
                  key: ADMIN_USERNAME
            - name: ADMIN_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: archivebox-config
                  key: ADMIN_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /data
            - name: index
              mountPath: /index
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
      volumes:
  # A note on `type: Directory` below, which is doing real work.
  #
  # The alternative, DirectoryOrCreate, is the default reflex and it is wrong for
  # a disk that can go away. With the 6TB unmounted, /srv/storage still exists —
  # it is the mount point, an empty directory on the boot disk. DirectoryOrCreate
  # would create the app's folders inside it, the app would start, find no
  # database, and cheerfully build a new one on the boot SSD. Mount the 6TB again
  # and the real data reappears underneath, with the app now pointed at a second
  # copy it made while the disk was missing.
  #
  # Directory refuses. The app's subdirectory only exists when the disk is
  # mounted, so an unmounted disk means the pod stops at ContainerCreating with
  # the missing path named in its events. Loud and harmless, instead of quiet and
  # not.
        - name: data
          hostPath:
            path: __DATA_DIR__/ArchiveBox
            type: Directory
        # SSD: the SQLite index. Read at random, so it lives on the fast
        # disk. The init script symlinks it into /data where ArchiveBox
        # expects it.
        - name: index
          hostPath:
            path: __APPS_DIR__/ArchiveBox
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: archivebox
  namespace: pi
spec:
  selector:
    app: archivebox
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: archivebox
  namespace: pi
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: archivebox
      port:
        name: http
  tls:
    - hosts: ["archivebox"]
