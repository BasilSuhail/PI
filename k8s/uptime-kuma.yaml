# Uptime Kuma: the thing that tells you a service died, instead of you finding
# out by opening the console and looking.
#
# Deployed by deploy/install-uptime-kuma.sh. Lives in the `pi` namespace
# alongside the dashboard, because a second namespace for one small workload
# buys nothing on a single-node cluster.
#
# Reached on its own tailnet name rather than a path under the console's. Kuma
# is a single-page app that assumes it owns the root path, and serving it from
# a subdirectory breaks its websocket and its asset URLs. The Tailscale
# operator gives it a name of its own, which is also the shape every service
# added after this one will want.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: uptime-kuma
  namespace: pi
spec:
  accessModes: [ReadWriteOnce]
  # SQLite plus a few months of heartbeats. Kuma prunes its own history, and
  # local-path can be grown later if that turns out to be wrong.
  resources:
    requests:
      storage: 2Gi
  # k3s' bundled provisioner. Node-local, which is fine: one replica pinned to
  # the board that holds the volume is exactly what this workload wants.
  storageClassName: local-path
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: uptime-kuma
  namespace: pi
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the volume is ReadWriteOnce and SQLite does
  # not want two writers, so the old pod has to be gone before the new one
  # starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: uptime-kuma
  template:
    metadata:
      labels:
        app: uptime-kuma
    spec:
      nodeSelector:
        node-role.kubernetes.io/control-plane: "true"
      # MagicDNS names do not resolve inside a pod. DNS there goes to CoreDNS,
      # which has never heard of the tailnet, so every monitor failed with
      # "getaddrinfo ENOTFOUND pi.<tailnet>.ts.net" while the same URLs
      # answered fine from a laptop.
      #
      # The addresses are given here rather than in the URLs so the names
      # survive: the boards' certificates are issued to their tailnet names, and
      # a monitor pointed at a bare address would fail TLS instead. Routing to
      # the address already works, which is how the dashboard polls the agents.
      #
      # The operator's own DNSConfig does not help. Its nameserver only carries
      # records for proxies the operator created, and the boards are ordinary
      # tailnet machines. Proper name resolution for those would mean an egress
      # proxy per board plus a CoreDNS stub, which is four moving parts and two
      # extra pods to save editing two lines when a board is added.
      hostAliases:
        - ip: "<pi-tailscale-ip>"
          hostnames: ["pi.<tailnet>.ts.net"]
        - ip: "<pi2-tailscale-ip>"
          hostnames: ["pi2.<tailnet>.ts.net"]
      containers:
        - name: uptime-kuma
          image: louislam/uptime-kuma:1.23.16
          ports:
            - name: http
              containerPort: 3001
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              memory: 96Mi
              cpu: 20m
            # Idles near 100 MB. The ceiling is for a runaway, not a target.
            limits:
              memory: 384Mi
          # Kuma serves its own dashboard, so a plain GET proves the process is
          # answering. Slow start: it runs migrations on a cold database.
          readinessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 60
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              # Three, each for a reason.
              #
              # SETGID and SETUID: the image's entrypoint hands off to the app
              # through `setpriv`, which calls setgroups(2), and that syscall
              # needs CAP_SETGID whatever user it is switching to. Without them
              # the container dies on its first line with
              # "setpriv: setgroups failed: Operation not permitted",
              # before any of Kuma's own code runs.
              #
              # NET_RAW: without it Kuma cannot send ICMP, so ping monitors
              # fail while HTTP ones pass, which reads as a dead board rather
              # than a missing capability.
              add: ["SETGID", "SETUID", "NET_RAW"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: uptime-kuma
---
apiVersion: v1
kind: Service
metadata:
  name: uptime-kuma
  namespace: pi
spec:
  selector:
    app: uptime-kuma
  ports:
    - name: http
      port: 80
      targetPort: http
---
# The Tailscale operator watches for this class and puts the Service on the
# tailnet under metadata.name, so this becomes https://uptime.<tailnet>.ts.net
# with a real certificate and no open ports. Requires the operator: see
# k8s/tailscale-operator.yaml.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: uptime
  namespace: pi
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: uptime-kuma
      port:
        name: http
  tls:
    - hosts: ["uptime"]
